[project]
name = "synkey-lib"
version = "0.1.0"
description = "Turn a folder of MIDI files into a publishable SynKey remote library."
readme = "README.md"
authors = [
    { name = "Aron Wiederkehr", email = "aron.wiederkehr@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
synkey-lib = "synkey_lib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
